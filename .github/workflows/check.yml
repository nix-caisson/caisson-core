name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # Upstream Nix, not Determinate Nix: the action has
          # defaulted determinate to true since v21, and this
          # project targets the Nix everyone else runs.
          determinate: false
      - name: builtins-only lint
        run: |
          if grep -RnE '(^|[^a-zA-Z_.])(lib|pkgs)[.]' lib; then
            echo "lib/ may reference nothing but builtins" >&2
            exit 1
          fi
      - run: nix flake check -L
      - run: nix eval -f tests summary
  # The slipping compat run: caisson-compat's pinned-world suite with
  # this working tree overriding the caisson-core pin;
  # non-blocking by design (compat HEAD is mutable external state).
  compat-suite:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # Upstream Nix, not Determinate Nix: the action has
          # defaulted determinate to true since v21, and this
          # project targets the Nix everyone else runs.
          determinate: false
      - run: |
          nix eval 'github:nix-caisson/caisson-compat#lib.caisson-compat.tests.summary' \
            --override-input caisson-core "path:$PWD"
