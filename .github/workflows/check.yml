name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: builtins-only lint
        run: |
          if grep -RnE '(^|[^a-zA-Z_.])(lib|pkgs)[.]' lib; then
            echo "lib/ may reference nothing but builtins" >&2
            exit 1
          fi
      - run: nix flake check -L
      - run: nix eval -f tests summary
  # The slipping compat run: caisson-compat's pinned-world suite with
  # this working tree overriding the caisson-core pin. Needs the
  # CAISSON_CI_SSH_KEY secret while the repositories are private;
  # non-blocking by design (compat HEAD is mutable external state).
  compat-suite:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      HAVE_KEY: ${{ secrets.CAISSON_CI_SSH_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - if: env.HAVE_KEY == 'false'
        run: echo "CAISSON_CI_SSH_KEY is not set; sibling repos are private; skipping"
      - if: env.HAVE_KEY == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CAISSON_CI_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - if: env.HAVE_KEY == 'true'
        uses: DeterminateSystems/nix-installer-action@v16
      - if: env.HAVE_KEY == 'true'
        run: |
          nix eval 'git+ssh://git@github.com/nix-caisson/caisson-compat#lib.caisson-compat.tests.summary' \
            --override-input caisson-core "path:$PWD"
