name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # Upstream Nix, not Determinate Nix: the action has
          # defaulted determinate to true since v21, and this
          # project targets the Nix everyone else runs.
          determinate: false
      # The builtins-only rule: nothing under lib/ or lib-overlays/
      # reaches for a `lib` or a `pkgs` from outside. Nix's parser rejects a
      # free variable, so parsing every file refuses a free `lib.x` or
      # `pkgs.x` while leaving prose inside strings alone. A `lib` or
      # `pkgs` bound as an argument parses, and the tests refuse it:
      # every file is called with closure arguments that hold neither.
      - name: builtins-only lint
        run: |
          find lib lib-overlays -name '*.nix' -print0 \
            | xargs -0 -n1 nix-instantiate --parse > /dev/null
      # Nix lets some builtins be written without the `builtins.`
      # prefix: `import`, `throw`, `toString`, `map` and the others
      # listed in `names` below. The library code writes the prefix on
      # those too (`builtins.import`), so `builtins` is the one name it
      # uses that it does not define. This step refuses a bare use.
      # `true`, `false` and `null` stay bare. The parser's
      # output has no comments and has interpolations expanded to
      # code, so with string literals removed a bare name is a use.
      - name: qualified-builtins lint
        run: |
          names='abort|baseNameOf|break|derivation|derivationStrict|dirOf|fetchGit|fetchMercurial|fetchTarball|fetchTree|fromTOML|import|isNull|map|placeholder|removeAttrs|scopedImport|throw|toString'
          status=0
          while IFS= read -r -d '' file; do
            found=$(nix-instantiate --parse "$file" \
              | sed -E 's/"([^"\\]|\\.)*"//g' \
              | grep -oE "(^|[^.A-Za-z0-9_'-])($names)([^A-Za-z0-9_'-]|\$)" \
              | sort | uniq -c | tr '\n' ' ' || true)
            if [ -n "$found" ]; then
              echo "$file: bare global builtins: $found"
              status=1
            fi
          done < <(find lib lib-overlays -name '*.nix' -print0)
          exit "$status"
      - run: nix flake check -L
      - run: nix eval -f tests summary
  # The slipping downstream run: caisson's pinned-world check, built
  # from caisson's main with this working tree overriding its
  # caisson-core pin. Non-blocking by design: caisson's main is state
  # this repository does not control, and a breaking change here is
  # red until the caisson change that follows it lands.
  pinned-world:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # Upstream Nix, not Determinate Nix: the action has
          # defaulted determinate to true since v21, and this
          # project targets the Nix everyone else runs.
          determinate: false
      - run: |
          nix build -L 'github:nix-caisson/caisson#checks.x86_64-linux.pinned-world' \
            --override-input caisson-core "path:$PWD"
